server.port=8083
spring.application.name=order-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:FoodDeliveryJwtSecretKeyMustBeAtLeast256BitsLongForHS256!!}
jwt.expiration-ms=86400000

consumer.service.url=${CONSUMER_SERVICE_URL:http://localhost:8081}
provider.service.url=${PROVIDER_SERVICE_URL:http://localhost:8082}
